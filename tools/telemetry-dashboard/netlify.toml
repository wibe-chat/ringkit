# There are no static files: every request is rewritten to the one function,
# which serves both the dashboard HTML and its JSON API. `public/` is an empty
# placeholder so Netlify has a publish directory.
[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  # SUPABASE_URL is the PUBLIC project endpoint (every device hits it; it ships
  # in the app's telemetry config) — it is NOT a secret. Netlify's secret scanner
  # flags it only because its value appears in this folder's README as the value
  # to paste. Exclude that one key; the real secret (SUPABASE_SERVICE_ROLE_KEY)
  # is never in source, so it stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/dashboard"
  status = 200
