# SCOPE-1 CI: format → analyze (fatal-infos) → Dart tests → Robolectric
# (generated §5.1/§7.5 suites) → emulator matrix (live integration +
# two-phase killed-state harness, §14.1(3)/(4)). AGP-8.x + no-Firebase
# consumer jobs land with the scope exit checklist.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Private repo = billed minutes: a newer push supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Golden rule (PLAN §4.1/§13.2): core/ never imports Flutter classes —
      # that seam is what keeps every flow cold-process-safe (R1) and
      # Robolectric-testable. Fail loudly on the first violation.
      - name: core/ has zero Flutter imports
        run: |
          if grep -rn "io\.flutter" android/src/main/kotlin/com/wibechat/ringkit/core/; then
            echo "::error::Flutter import found under core/ — forbidden (PLAN §4.1)"
            exit 1
          fi
      # KGP-free build (PLAN §13.1): the plugin must never apply the Kotlin
      # Android Gradle plugin — AGP 9 Built-in Kotlin only (R27).
      - name: plugin build is KGP-free
        run: |
          if grep -n 'id("org.jetbrains.kotlin.android")' android/build.gradle.kts; then
            echo "::error::org.jetbrains.kotlin.android applied in plugin build — forbidden (PLAN §13.1)"
            exit 1
          fi
      # Pigeon pin is exact (PLAN §13.1): a caret/range pin would let codegen drift.
      - name: pigeon is exact-pinned
        run: |
          if ! grep -En "^  pigeon: [0-9]+\.[0-9]+\.[0-9]+$" pubspec.yaml; then
            echo "::error::pigeon must be exact-pinned in pubspec.yaml (PLAN §13.1)"
            exit 1
          fi

  dart:
    name: format · analyze · dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: format (schema + lib + test)
        run: dart format --output=none --set-exit-if-changed lib test pigeons
      - name: pigeon outputs are committed & current
        # Pigeon's Dart output is not dart-format-clean; the repo convention is
        # regen → format → commit, so CI reproduces exactly that before diffing.
        run: |
          dart pub get
          dart run pigeon --input pigeons/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code -- lib/src/messages.g.dart android/src/main/kotlin/com/wibechat/ringkit/adapter/Messages.g.kt
      - name: analyze (zero infos tolerated — pana gate)
        run: flutter analyze --fatal-infos
      - name: dart unit tests
        run: flutter test

  robolectric:
    name: robolectric (generated §5.1 + §7.5 suites, API sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: build example once (wires the plugin project)
        run: |
          flutter pub get
          cd example && flutter build apk --debug
      - name: run Robolectric suites
        run: cd example/android && ./gradlew :ringkit:testDebugUnitTest --console=plain
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robolectric-reports
          path: android/build/reports/tests/

  emulator:
    name: emulator API ${{ matrix.api-level }} (integration + killed-state harness)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # §14.1: 26 = minSdk floor · 31 = trampoline/FGS-bg limits · 33 = tops
        # the §10.2 expedited-work branch + POST_NOTIFICATIONS · 34 = FSI
        # special access + FGS types · 36 = targetSdk (Robolectric can't).
        include:
          # x86_64 everywhere: Flutter ships NO 32-bit x86 Android libs —
          # an x86 image can never install the APK (INSTALL_FAILED_NO_MATCHING_ABIS,
          # proven on the first emulator run).
          - api-level: 26
            target: default
            arch: x86_64
          - api-level: 31
            target: default
            arch: x86_64
          - api-level: 33
            target: google_apis
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64
          - api-level: 36
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: free runner disk space
        # First run proved the emulator dies with "FATAL | Not enough space to
        # create userdata partition" (~3 GB free vs 7.3 GB needed): drop the
        # preinstalled toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: build debug apk
        run: |
          flutter pub get
          cd example && flutter build apk --debug
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}
      - name: create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: live integration + two-phase killed-state harness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r example/build/app/outputs/flutter-apk/app-debug.apk
            if [ "${{ matrix.api-level }}" -ge 33 ]; then adb shell pm grant com.wibechat.ringkit_example android.permission.POST_NOTIFICATIONS; fi
            # Harness FIRST: `flutter test integration_test` uninstalls the app
            # when it finishes (verified on-device), which would strand any
            # adb-driven step that runs after it.
            tools/killed_state_harness.sh
            cd example && flutter test integration_test/ring_flow_test.dart -d "$(adb devices | awk 'NR==2{print $1}')"
      - name: upload logcat on failure
        if: failure()
        # timeout guard: with a dead emulator this hung 45 min on the first run.
        run: timeout 60 adb logcat -d > logcat-${{ matrix.api-level }}.txt || true
      - name: upload logcat artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-${{ matrix.api-level }}
          path: logcat-${{ matrix.api-level }}.txt

  # Example release build — R8/R26 survival (WorkManager consumer-rules, §13.1 v1.3.8).
  # NOTE (M4.2): the example now bundles firebase_messaging (Mode-1 baseline), so this
  # job NO LONGER doubles as the "no-Firebase consumer" proof. A dedicated minimal
  # no-Firebase consumer job is TODO per §14.2 — it guards RingKitMessagingReceiver's
  # `compileOnly` firebase + `-dontwarn com.google.firebase.messaging.**` arrangement
  # (the disabled c2dm receiver's RemoteMessage reference must not break a Firebase-free
  # consumer's R8 release build).
  release-build:
    name: example release build (AGP 9.x · Firebase-free · R8 survival R7/R26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: build example --release (R8 on)
        run: cd example && flutter build apk --release
      - name: plugin resources survive shrinking (R7/R26)
        run: |
          APK=example/build/app/outputs/flutter-apk/app-release.apk
          # Release resource optimization SHORTENS/obfuscates paths
          # (res/raw/x.wav → res/Tn.wav), so assert by CONTENT, not name:
          # the bundled default ringtone is a RIFF/WAV — if the shrinker ate
          # it, the ringtone ladder's failure rung is gone (R7/R26).
          ENTRIES=$(unzip -Z1 "$APK" | grep -c "^res/")
          echo "res/ entries: $ENTRIES"
          test "$ENTRIES" -ge 1
          FOUND=""
          for f in $(unzip -Z1 "$APK" | grep "^res/"); do
            SIG=$(unzip -p "$APK" "$f" 2>/dev/null | head -c 4)
            if [ "$SIG" = "RIFF" ]; then FOUND="$f"; break; fi
          done
          echo "WAV ringtone payload: ${FOUND:-MISSING}"
          test -n "$FOUND"

  consumer-agp8:
    name: consumer build — AGP 8.11 (KGP-free plugin under an AGP 8.x app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: pin the example app to AGP 8.11.1
        run: |
          sed -i 's/id("com.android.application") version "9.0.1"/id("com.android.application") version "8.11.1"/' \
            example/android/settings.gradle.kts
          grep -q 'version "8.11.1"' example/android/settings.gradle.kts || { echo "AGP pin sed missed"; exit 1; }
      - name: build example --release under AGP 8.x (validated locally 2026-07-06)
        run: cd example && flutter build apk --release
